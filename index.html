<!doctype html>
<html lang="es-CL" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <meta
      name="description"
      content="IanForgottenShoop: creamos páginas web profesionales a medida para negocios en Chile. Sitios web, landings de campaña, tiendas online con Webpay y planes de mantención mensual."
    />
    <title>IanForgottenShoop · Páginas web profesionales para tu negocio en Chile</title>

    <!-- Estilos críticos: fondo oscuro y loader visibles aunque el resto tarde en cargar -->
    <style>
      html { background: #09090b; color: #d4d4d8; }
      body { margin: 0; min-height: 100vh; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      #root:empty { min-height: 100vh; }
      .boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px; }
      .boot-logo { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #8b5cf6, #d946ef); display: flex; align-items: center; justify-content: center; animation: boot-pulse 1.4s ease-in-out infinite; }
      .boot-logo svg { width: 30px; height: 30px; }
      .boot p { margin: 0; font-size: 14px; color: #a1a1aa; }
      .boot h1 { margin: 0; font-size: 20px; color: #fff; font-weight: 600; }
      .boot code { display: block; margin-top: 6px; padding: 10px 12px; border-radius: 10px; background: #17171c; color: #c4b5fd; font-size: 12px; max-width: 560px; word-break: break-word; white-space: pre-wrap; }
      .boot a, .boot button { display: inline-flex; align-items: center; justify-content: center; padding: 12px 22px; border-radius: 999px; border: 0; cursor: pointer; font: 600 14px/1 Inter, system-ui, sans-serif; text-decoration: none; }
      .boot .primary { background: linear-gradient(90deg, #8b5cf6, #7c3aed); color: #fff; }
      .boot .wa { background: #25d366; color: #09090b; margin-left: 10px; }
      @keyframes boot-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.92); opacity: 0.7; } }
    </style>

    <!-- Marca que hay JS activo (las animaciones de scroll solo ocultan contenido si el JS funciona) -->
    <script>
      document.documentElement.classList.add("js");
    </script>

    <!-- Fuentes: carga NO bloqueante (si Google Fonts no responde, la página igual se muestra) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      />
    </noscript>

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%23d946ef'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M9 11L4 16l5 5M23 11l5 5-5 5M18.5 7l-5 18' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root">
      <div class="boot" data-boot>
        <div class="boot-logo" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11L4 16l5 5M23 11l5 5-5 5M18.5 7l-5 18" />
          </svg>
        </div>
        <p>Cargando IanForgottenShoop…</p>
      </div>
    </div>

    <noscript>
      <div class="boot">
        <h1>Este sitio necesita JavaScript</h1>
        <p>Activa JavaScript en tu navegador para ver la página, o escríbenos directo por WhatsApp.</p>
        <a class="wa" href="https://wa.me/569998789119">Hablar por WhatsApp</a>
      </div>
    </noscript>

    <!-- Vigilancia de arranque: si algo falla, muestra el error en pantalla en vez de dejarla en blanco -->
    <script>
      (function () {
        var shown = false;
        function isBooting() {
          var root = document.getElementById("root");
          return root && root.querySelector("[data-boot]");
        }
        function show(title, detail) {
          if (shown || !isBooting()) return;
          shown = true;
          var root = document.getElementById("root");
          var box = document.createElement("div");
          box.className = "boot";
          var h = document.createElement("h1");
          h.textContent = title;
          var p = document.createElement("p");
          p.textContent = "Intenta recargar la página o abrirla en un navegador actualizado (Chrome, Edge, Firefox o Safari).";
          box.appendChild(h);
          box.appendChild(p);
          if (detail) {
            var c = document.createElement("code");
            c.textContent = String(detail);
            box.appendChild(c);
          }
          var actions = document.createElement("div");
          var reload = document.createElement("button");
          reload.className = "primary";
          reload.textContent = "Recargar";
          reload.onclick = function () { location.reload(); };
          var wa = document.createElement("a");
          wa.className = "wa";
          wa.href = "https://wa.me/569998789119";
          wa.textContent = "WhatsApp";
          actions.appendChild(reload);
          actions.appendChild(wa);
          box.appendChild(actions);
          root.innerHTML = "";
          root.appendChild(box);
        }
        window.addEventListener("error", function (e) {
          show("No se pudo cargar la página", e && (e.message || (e.error && e.error.message)));
        });
        window.addEventListener("unhandledrejection", function (e) {
          var r = e && e.reason;
          show("No se pudo cargar la página", r && (r.message || String(r)));
        });
        setTimeout(function () {
          show("La página está tardando demasiado en cargar", "Tiempo de espera agotado (15 s).");
        }, 15000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>

    <!-- Elimina el aviso "Built with Arena" que inyecta la plataforma de hosting -->
    <script>
      (function () {
        var patterns = [/built with arena/i, /user-generated and unverified/i, /content is user-generated/i];

        function isBadgeish(el) {
          if (!el || el === document.body || el === document.documentElement) return false;
          var hay = ((el.className && String(el.className)) || "") + " " + (el.id || "");
          if (/arena|watermark|badge|attribution|credit|branding/i.test(hay)) return true;
          try {
            var pos = window.getComputedStyle(el).position;
            if (pos === "fixed" || pos === "sticky") return true;
          } catch (e) {}
          return false;
        }

        function sweep() {
          var found = [];
          try {
            var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
              acceptNode: function (node) {
                var v = node.nodeValue || "";
                for (var i = 0; i < patterns.length; i++) {
                  if (patterns[i].test(v)) return NodeFilter.FILTER_ACCEPT;
                }
                return NodeFilter.FILTER_REJECT;
              },
            });
            while (walker.nextNode()) found.push(walker.currentNode);
          } catch (e) {}
          found.forEach(function (textNode) {
            var el = textNode.parentElement;
            if (!el) return;
            var chain = [];
            var cur = el;
            while (cur && cur !== document.body && cur !== document.documentElement) {
              chain.push(cur);
              if (isBadgeish(cur)) break;
              cur = cur.parentElement;
            }
            var target = null;
            for (var i = 0; i < chain.length; i++) {
              if (isBadgeish(chain[i])) {
                target = chain[i];
                break;
              }
            }
            if (!target) {
              for (var j = 0; j < chain.length; j++) {
                var txt = (chain[j].textContent || "").trim();
                if (txt.length < 200) {
                  target = chain[j];
                  break;
                }
              }
            }
            if (target && target !== document.body) {
              target.style.setProperty("display", "none", "important");
              target.setAttribute("hidden", "");
            }
          });
          // Si el aviso llega dentro de un iframe propio de la plataforma, lo ocultamos
          try {
            document.querySelectorAll("iframe").forEach(function (f) {
              var src = (f.src || f.getAttribute("src") || "");
              if (/arena/i.test(src) || /watermark/i.test(src)) f.style.display = "none";
            });
          } catch (e) {}
        }

        function debouncedSweep() {
          clearTimeout(sweep._t);
          sweep._t = setTimeout(sweep, 80);
        }

        sweep();
        document.addEventListener("DOMContentLoaded", sweep);
        if (window.MutationObserver) {
          var mo = new MutationObserver(debouncedSweep);
          mo.observe(document.documentElement, { childList: true, subtree: true });
        }
        setTimeout(sweep, 1000);
        setTimeout(sweep, 2500);
        setTimeout(sweep, 5000);
      })();
    </script>
  </body>
</html>
